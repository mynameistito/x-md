<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="x.md docs for agent-friendly, read-only X browsing: posts, videos, profiles, search, conversations, followers and following in compact or full Markdown and JSON."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#f7f6f2" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        const saved = localStorage.getItem('x-md-theme')
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#11120f' : '#f7f6f2')
      })()
    </script>
    <title>Docs — x.md</title>
    <link rel="canonical" href="https://x.pcstyle.dev/docs" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="x.md" />
    <meta property="og:title" content="Docs — x.md" />
    <meta
      property="og:description"
      content="Read-only HTTP routes for public X posts, profiles, search, conversations, followers and following, with compact or full Markdown and JSON."
    />
    <meta property="og:url" content="https://x.pcstyle.dev/docs" />
    <meta property="og:image" content="https://x.pcstyle.dev/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Docs — x.md" />
    <meta name="twitter:description" content="x.md docs: agent-friendly, read-only X browsing routes with compact or full Markdown and JSON." />
    <meta name="twitter:image" content="https://x.pcstyle.dev/og.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/docs.ts"></script>
  </body>
</html>
